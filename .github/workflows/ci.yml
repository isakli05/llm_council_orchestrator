# Scoped CI: this pipeline gates packages/spec-core ONLY (the workspace root
# defines no build/test targets — the legacy tree was removed 2026-08; see
# docs/legacy-archive.md); the
# workflow name `ci-spec-core` makes that scope visible in status checks
# and the README badge. The badge URL is keyed on this FILE name (ci.yml),
# so the workflow `name` can be scoped without breaking the badge.
name: ci-spec-core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # H-13: one leg per Node version PAIRED with a Graphify pin — the
      # supported FLOOR (0.9.50) and the newest release verified compatible
      # (0.9.53 at the time of this change; re-check PyPI when bumping).
      # Without an installed Graphify the real integration suite would
      # silently skip — a release-critical dependency must actually run.
      matrix:
        include:
          - node: 22
            graphify: '0.9.50'
          - node: 24
            graphify: '0.9.53'
    steps:
      - uses: actions/checkout@v4

      # H-13: install the pinned Graphify BEFORE tests so the renewal
      # integration suite RUNS (not skips). The integration canary asserts
      # availability inside CI (see graphify-adapter.integration.test.ts).
      - name: Install pinned Graphify (${{ matrix.graphify }})
        run: |
          python3 -m pip install --user --disable-pip-version-check "graphifyy==${{ matrix.graphify }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          graphify --version

      # Root package.json pins `packageManager: pnpm@10.17.1`; the explicit
      # version below is kept as a second pin so a stray edit to root
      # package.json cannot silently change the CI toolchain — they must
      # agree. pnpm must be installed BEFORE setup-node so the pnpm store
      # path can be resolved for caching.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build MUST run before test: the MCP spawn test requires dist/.
      # `build` itself removes dist/ first (TEST-002) — a stale module from
      # a renamed/deleted source file cannot survive into the pack step.
      # Filter by package path, not name: pnpm exits 0 when a name filter
      # matches nothing, so a package rename would silently skip CI.
      - run: pnpm --filter ./packages/spec-core build

      # TEST-002 freshness gate: the build step above regenerated
      # generated/spec-schema.json from current source. If that left the
      # working tree dirty — artifact stale, or missing from the repo and
      # only existing locally — the committed artifact does not match the
      # schema the code ships. `git status --porcelain` (not bare
      # git-diff) so an untracked regenerated artifact also fails.
      - name: Fail if generated schema artifact is stale
        run: |
          CHANGED=$(git status --porcelain -- packages/spec-core/generated/)
          if [ -n "$CHANGED" ]; then
            echo "::error::packages/spec-core/generated/spec-schema.json does not match what build regenerates from source."
            echo "::error::Regenerate and commit: pnpm --filter ./packages/spec-core build && git add packages/spec-core/generated && git commit"
            echo "$CHANGED"
            exit 1
          fi

      - run: pnpm --filter ./packages/spec-core lint
      # TEST-003 coverage gate: the same suite, run with v8 coverage and
      # threshold enforcement (ratchet configured in vitest.config.ts, a few
      # points under measured). Local `pnpm test` stays coverage-free for a
      # fast inner loop; CI pays the ~3s overhead once per matrix leg.
      - run: pnpm --filter ./packages/spec-core test:coverage

      # TEST-002 packed-install gate: build -> npm pack -> install the REAL
      # tarball into a throwaway project -> run installed `lco init`,
      # `lco --help/--version`, and an `lco-mcp` JSON-RPC handshake.
      - run: pnpm --filter ./packages/spec-core smoke:packed
